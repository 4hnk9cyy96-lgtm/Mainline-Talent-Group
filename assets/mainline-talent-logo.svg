<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <style>
      .mainline-text { font-family: Arial, sans-serif; font-size: 120px; font-weight: bold; fill: #d4af99; letter-spacing: 2px; }
      .talent-text { font-family: Arial, sans-serif; font-size: 40px; fill: #d4af99; letter-spacing: 3px; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="#000000"/>
  
  <!-- Circle outline -->
  <circle cx="600" cy="200" r="180" fill="none" stroke="#d4af99" stroke-width="3"/>
  
  <!-- Lightning bolt design element (left) -->
  <polygon points="320,80 360,160 340,160 380,260" fill="none" stroke="#d4af99" stroke-width="8" stroke-linejoin="miter"/>
  
  <!-- Lightning bolt design element (right) -->
  <polygon points="880,80 840,160 860,160 820,260" fill="none" stroke="#d4af99" stroke-width="8" stroke-linejoin="miter"/>
  
  <!-- Main text: MAINLINE -->
  <text x="600" y="220" text-anchor="middle" class="mainline-text">MAINLINE</text>
  
  <!-- Subtitle: TALENT -->
  <text x="600" y="290" text-anchor="middle" class="talent-text">TALENT</text>
  
  <!-- Horizontal lines -->
  <line x1="200" y1="200" x2="380" y2="200" stroke="#d4af99" stroke-width="2"/>
  <line x1="820" y1="200" x2="1000" y2="200" stroke="#d4af99" stroke-width="2"/>
</svg>